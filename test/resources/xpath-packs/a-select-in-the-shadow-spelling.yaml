---
pack: variable-or-param-with-select-and-content
found:
  amount: 3
  positions: [ [ 5, 5 ], [ 8, 5 ], [ 18, 7 ] ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0" id="style1">
    <xsl:output encoding="UTF-8" method="xml"/>
    <xsl:template name="observatory">
      <xsl:param name="astronomer" _select="{'Caroline Herschel'}">
        <astronomer>Wilhelm Herschel</astronomer>
      </xsl:param>
      <xsl:variable name="telescope" _select="{'reflector'}">
        <telescope>refractor</telescope>
      </xsl:variable>
      <xsl:variable name="observation" _select="{'comet'}"/>
      <xsl:value-of select="$astronomer"/>
      <xsl:value-of select="$telescope"/>
      <xsl:value-of select="$observation"/>
    </xsl:template>
    <xsl:template match="/sky">
      <xsl:call-template name="observatory">
        <xsl:with-param name="astronomer" _select="{'Annie Cannon'}">
          <astronomer>Henrietta Leavitt</astronomer>
        </xsl:with-param>
      </xsl:call-template>
      <xsl:variable name="catalogue">
        <catalogue>Messier</catalogue>
      </xsl:variable>
      <xsl:value-of select="$catalogue"/>
    </xsl:template>
  </xsl:stylesheet>
