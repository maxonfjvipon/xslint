---
pack: invalid-xpath-expression
# A stylesheet declaring no version is read at the most permissive one this tool
# knows, so the modern syntax around it parses and nothing is later than the
# version in force. That leaves the fault on the last line as the text's own,
# which is what keeps a genuine mistake from being blamed on a version nobody
# declared. Its sibling pack pins the other half: modern syntax alone under an
# undeclared version draws no defect of either kind.
found:
  amount: 1
  positions: [ [ 6, 30 ] ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:xs="http://www.w3.org/2001/XMLSchema">
    <xsl:template match="alpha/(beta|gamma)">
      <xsl:value-of select="1 cast as xs:integer"/>
      <xsl:value-of select="if (delta) then 1 else 2"/>
      <xsl:value-of select="1 +"/>
    </xsl:template>
  </xsl:stylesheet>
